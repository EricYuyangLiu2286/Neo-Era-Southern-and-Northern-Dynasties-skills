 nesnd_cne_confidence.4.t:0 "The Republicans Submit"
 nesnd_cne_confidence.4.d:0 "The republican coalition can no longer keep up the war. Its provinces return to imperial rule. The fighting has ended, though the questions raised by the rebels remain."
 nesnd_cne_confidence.4.f:0 "“Where is the land the Great Revolution promised us?”\n- A question still asked in the villages"
 nesnd_cne_confidence.4.a:0 "Restore the provincial administration."
